name: Amberpoint
description: 'AmberPoint was an enterprise software company founded in 2001 that provided runtime
  management, monitoring, and governance solutions for Service-Oriented Architecture (SOA) and
  distributed web-services applications. Its products let organizations discover, secure, monitor,
  and enforce policy across complex multi-application business processes and message flows, and
  competed in the SOA management space alongside vendors integrated into enterprise middleware
  stacks. AmberPoint was acquired by Oracle on February 8, 2010, with its technology folded into
  Oracle Fusion Middleware and Oracle Enterprise Manager. The company no longer operates
  independently; the amberpoint.com domain is held by Oracle and no longer serves a public
  developer surface. This profile is retained in the API Evangelist network as a historical
  portfolio-lead record surfaced from a venture-capital portfolio.'
